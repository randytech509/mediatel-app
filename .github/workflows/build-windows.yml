# ═══════════════════════════════════════════════════════════════
#  RANDROID — Mediatel Windows Build (GitHub Actions)
#  Runs tests, builds Windows .exe files, smoke-tests binaries
# ═══════════════════════════════════════════════════════════════

name: Build and Test Windows Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  test-and-build:
    name: Test & Build Windows EXEs
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Automated Unit Tests
      run: |
        python -m unittest discover -s Sources/Mediatel/windows-build/tests -p "test_*.py" -v

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build Mediatel GUI
      run: |
        cd Sources/Mediatel/windows-build/mediatel-gui
        pyinstaller --clean --noconfirm mediatel_gui.spec

    - name: Build Mediatel CLI
      run: |
        cd Sources/Mediatel/windows-build/mediatel-cli
        pyinstaller --clean --noconfirm mediatel_cli.spec

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        cp Sources/Mediatel/windows-build/mediatel-gui/dist/Mediatel.exe artifacts/
        cp Sources/Mediatel/windows-build/mediatel-cli/dist/mediatel-cli.exe artifacts/
      shell: bash

    - name: Smoke Test CLI Executable
      run: |
        ./artifacts/mediatel-cli.exe --version
        ./artifacts/mediatel-cli.exe --help
        ./artifacts/mediatel-cli.exe devices
      shell: bash

    - name: Smoke Test GUI Executable Existence & Size
      run: |
        ls -la artifacts/Mediatel.exe
        test -s artifacts/Mediatel.exe
      shell: bash

    - name: Upload Mediatel GUI
      uses: actions/upload-artifact@v4
      with:
        name: Mediatel-GUI-Windows
        path: artifacts/Mediatel.exe

    - name: Upload Mediatel CLI
      uses: actions/upload-artifact@v4
      with:
        name: Mediatel-CLI-Windows
        path: artifacts/mediatel-cli.exe

    - name: Upload Complete Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Mediatel-Windows-Bundle
        path: artifacts/

  # Auto-create or update GitHub Release on version tags
  release:
    name: Create Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: Mediatel-Windows-Bundle
        path: release/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Mediatel ${{ github.ref_name }}"
        body: |
          ## RANDROID — Mediatel ${{ github.ref_name }}

          ### Verified & Tested Release
          All automated tests passed successfully on Windows before packaging.

          ### Downloads:
          - **[Mediatel.exe](https://github.com/randytech509/mediatel-app/releases/download/${{ github.ref_name }}/Mediatel.exe)** — Desktop GUI App (Dark Theme, File Manager, Flash Tool)
          - **[mediatel-cli.exe](https://github.com/randytech509/mediatel-app/releases/download/${{ github.ref_name }}/mediatel-cli.exe)** — Command-Line Interface (12 commands + interactive shell)

          ### Requirements:
          - Windows 10/11 (64-bit)
          - ADB in PATH or standard Android SDK
          - USB debugging enabled on your Android device

          ---
          *RandyTech Solutions © 2024-2026*
        files: |
          release/Mediatel.exe
          release/mediatel-cli.exe
        draft: false
        prerelease: false
